
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Grocery Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            font-family: Arial;
            background: #f0f7f0;
            margin: 0;
            padding: 0;
        }
        .login-box {
            width: 350px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 98%;
            padding: 12px;
            background: #269b50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        a { color: #269b50; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Grocery Store Login</h2>
    <p>Welcome back!</p>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username"
               placeholder="Enter Username" required>

        <input type="password" name="password"
               placeholder="Enter Password" required>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account?
        <a href="{% url 'register' %}">Register Here</a>
    </p>

    <a href="{% url 'home' %}">Back to Home</a>
</div>

</body>
</html>
